{% extends "base.html" %}

{% block content %}
<main class="container mt-5 pt-5 mb-5">
  <div class="row">
    <div class="col-lg-8 mx-auto">
      <article>
        <header class="mb-4">
          <h1 class="display-5">{{ page.title }}</h1>
          <p class="post-meta">
            <i class="far fa-calendar"></i> {{ page.date | date(format="%B %-d, %Y") }}
          </p>
        </header>
        <div class="post-content">
          {{ page.content | safe }}
          {%- if page.extra.external_url %}
          <p>{{ page.description }}</p>
          <p><a href="{{ page.extra.external_url }}">View on {{ page.extra.source }}</a></p>
          {%- endif %}
        </div>
      </article>
      <hr class="my-5">
      <div class="text-center">
        <a href="{{ get_url(path='@/posts/_index.md') }}" class="btn btn-outline-primary">
          <i class="fas fa-arrow-left"></i> Back to Posts
        </a>
      </div>
    </div>
  </div>
</main>
{% endblock content %}
